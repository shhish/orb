[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "orb-mcp"
version = "0.1.0"
description = "Loopback MCP bridge and durable webhook events for Orb"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["aiohttp==3.14.5", "jsonschema==4.26.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.1", "standardwebhooks==1.1.0", "ruff==0.17.2", "build==1.6.1"]

[project.scripts]
orb-mcp = "orb_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/orb_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
