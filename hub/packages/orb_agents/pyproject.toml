[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orb-agents"
version = "0.1.0"
description = "Async local coding-agent session adapters for Orb"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
test = ["pytest==8.4.2", "pytest-asyncio==1.2.0", "ruff==0.14.3", "build==1.3.0"]

[project.scripts]
orb-agents-hooks = "orb_agents.installer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orb_agents = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: isolated real-agent smoke tests; require ORB_AGENTS_LIVE=1"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC"]
ignore = ["ASYNC109"] # Protocol deadlines are adapter configuration, not caller cancellation.
