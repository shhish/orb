# Publishes a filtered snapshot of each v* release to the public GitHub repo,
# after a privacy check. Paths in .oss-export-exclude never leave Gitea.
# The check and the target are defined on the publishing host, not here.
name: Publish to GitHub

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-github
  cancel-in-progress: false

jobs:
  publish:
    runs-on: oss-publish
    timeout-minutes: 15
    steps:
      - uses: https://gitea.com/actions/checkout@v4
        with:
          fetch-depth: 0
      - run: "$HOME/.local/bin/oss-publish publish"
