[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orb-devtools"
version = "0.1.0"
description = "Local USB development infrastructure for Orb"
requires-python = ">=3.13"
dependencies = ["pyserial==3.5"]

[project.optional-dependencies]
ui = ["Pillow==12.0.0", "PyYAML==6.0.3"]
crash = ["esp-coredump==1.17.2", "esptool==5.6.0"]
test = ["pytest==8.4.2", "Pillow==12.0.0", "PyYAML==6.0.3", "ruff==0.14.2"]

[project.scripts]
orb-logd = "orb_devtools.logd:main"
orb-ui-test = "orb_devtools.ui:main"
orb-profile-convert = "orb_devtools.profile:main"
orb-crash = "orb_devtools.crash:main"

[tool.setuptools.packages.find]
where = ["devtools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["devtools", "scripts"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["firmware/third_party", "firmware/managed_components", "firmware/build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
